<article class="comentario">
  <div class="avatar">
    @if (comentario().autor.imagenPerfil) {
      <img [src]="comentario().autor.imagenPerfil" alt="Foto de perfil de {{ nombreAutor() }}" />
    } @else {
      {{ nombreAutor() | iniciales }}
    }
  </div>

  <div class="cuerpo">
    <p class="encabezado">
      <strong class="nombre">{{ nombreAutor() }}</strong>
      <span class="datos">
        &#64;{{ comentario().autor.nombreUsuario }} ·
        <span class="tiempo">{{ comentario().createdAt | tiempoRelativo }}</span>
        @if (comentario().modificado) {
          · <span class="editado">editado</span>
        }
      </span>
    </p>
    <!-- Bloque del mensaje: acá irá la capa de glifos del paso 7 -->
    <p class="mensaje">{{ comentario().mensaje }}</p>
  </div>
</article>
