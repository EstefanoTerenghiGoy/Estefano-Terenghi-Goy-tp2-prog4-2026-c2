<header class="barra">
  <a class="marca" routerLink="/publicaciones" aria-label="Quantic, ir a publicaciones">
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <circle cx="20" cy="20" r="11" fill="#F28C3826" />
      <circle cx="20" cy="20" r="7" fill="#F28C38" />
      <ellipse cx="20" cy="20" rx="18" ry="6.5" fill="none" stroke="#F28C38" stroke-width="1.2" transform="rotate(-20 20 20)" />
      <circle cx="36" cy="14.5" r="2" fill="#E8E6DF" />
    </svg>
    <span class="marca-texto">
      <span class="marca-nombre">QUANTIC</span>
      <span class="marca-lema">RED DE EXPLORADORES</span>
    </span>
  </a>

  <nav class="pestanas">
    <a class="pestana" routerLink="/publicaciones" routerLinkActive="activa" aria-label="Publicaciones">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="14" rx="3" />
        <path d="M8 9h8M8 13h5" />
      </svg>
      <span class="pestana-texto">PUBLICACIONES</span>
    </a>
  </nav>

  <div class="usuario" (clickOutside)="cerrarMenu()">
    <button
      type="button"
      class="burbuja"
      (click)="alternarMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Menú de usuario"
    >
      @if (usuario()?.imagenPerfil) {
        <img [src]="usuario()!.imagenPerfil" alt="" />
      } @else {
        {{ iniciales() }}
      }
    </button>

    @if (menuAbierto()) {
      <div class="menu" role="menu">
        <div class="menu-datos">
          <strong>{{ usuario()?.nombre }} {{ usuario()?.apellido }}</strong>
          <span class="menu-usuario">&#64;{{ usuario()?.nombreUsuario }}</span>
        </div>
        <a class="menu-item" role="menuitem" routerLink="/perfil" (click)="cerrarMenu()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
          Mi perfil
        </a>
        <button type="button" class="menu-item salir" role="menuitem" (click)="cerrarSesion()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
<!-- Regla de rayitas: solo decoración -->
<div class="regla" aria-hidden="true"></div>
