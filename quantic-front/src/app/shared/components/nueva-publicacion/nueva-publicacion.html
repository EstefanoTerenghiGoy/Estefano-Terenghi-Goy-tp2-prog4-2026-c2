<form class="tarjeta tarjeta-acento" [formGroup]="form" (ngSubmit)="enviar(selector)" novalidate>
  <p class="etiqueta">Nueva entrada</p>

  <div class="campo">
    <label for="nueva-titulo">Título</label>
    <input
      id="nueva-titulo"
      class="input"
      formControlName="titulo"
      placeholder="¿Qué descubriste hoy?"
      autocomplete="off"
      [attr.maxlength]="maxTitulo"
      [class.invalido]="invalido('titulo')"
      [attr.aria-invalid]="invalido('titulo')"
    />
    @if (invalido('titulo')) {
      <p class="error-campo">Escribí un título.</p>
    }
  </div>

  <div class="campo">
    <label for="nueva-mensaje">Mensaje</label>
    <textarea
      id="nueva-mensaje"
      class="input"
      rows="3"
      formControlName="descripcion"
      placeholder="Escribí tu registro..."
      [attr.maxlength]="maxMensaje"
      [class.invalido]="invalido('descripcion')"
      [attr.aria-invalid]="invalido('descripcion')"
    ></textarea>
    <div class="pie-mensaje">
      @if (invalido('descripcion')) {
        <p class="error-campo">Escribí un mensaje.</p>
      }
      <span class="contador">{{ form.controls.descripcion.value.length }} / {{ maxMensaje }}</span>
    </div>
  </div>

  @if (vistaPrevia()) {
    <div class="previa">
      <img [src]="vistaPrevia()" alt="Vista previa de la imagen que vas a adjuntar" />
      <button type="button" class="quitar" (click)="quitarImagen(selector)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
        Quitar imagen
      </button>
    </div>
  }

  <div class="acciones">
    <div class="adjunto">
      <input #selector type="file" accept="image/*" hidden (change)="elegirImagen($event)" />
      <button type="button" class="boton-archivo" (click)="selector.click()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <circle cx="9" cy="10" r="1.5" />
          <path d="M21 16l-5-5-8 8" />
        </svg>
        Adjuntar imagen (opcional)
      </button>
      @if (errorImagen()) {
        <p class="error-campo" role="alert">{{ errorImagen() }}</p>
      }
    </div>

    <button type="submit" class="boton" [disabled]="form.invalid || enviando()">
      {{ enviando() ? 'Registrando…' : 'Registrar' }}
    </button>
  </div>
</form>
